<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणित डॅशबोर्ड - डिजिटल शाळा</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        body { 
            background: #020205;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        #webgl-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        .main-container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        .back-btn { 
            background: rgba(255, 255, 255, 0.08); 
            border: 1px solid rgba(56, 239, 125, 0.5); 
            color: #38ef7d;
            padding: 10px 22px; 
            border-radius: 30px; 
            font-weight: 700; 
            backdrop-filter: blur(20px);
            box-shadow: 0 0 15px rgba(56, 239, 125, 0.2);
            font-size: 14px; 
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover { 
            background: rgba(56, 239, 125, 0.25); 
            box-shadow: 0 0 25px rgba(56, 239, 125, 0.6); 
        }

        .header { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px 20px; 
            border-radius: 30px; 
            backdrop-filter: blur(25px);
            margin-bottom: 30px; 
        }

        h1 { 
            background: linear-gradient(135deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px; 
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 239, 125, 0.3);
        }

        /* डॅशबोर्ड कार्ड्स ग्रिड */
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 239, 125, 0.3);
            border-radius: 25px;
            padding: 25px 20px;
            text-decoration: none;
            color: white;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .menu-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(56, 239, 125, 0.15);
            border-color: #38ef7d;
            box-shadow: 0 12px 30px rgba(56, 239, 125, 0.4);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 22px;
            font-weight: bold;
            color: #38ef7d;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <canvas id="webgl-bg"></canvas>

    <div class="main-container">
        <div class="top-bar">
            <a href="../index.html" class="back-btn">⬅️ मुख्य होमपेजवर जा</a>
        </div>

        <div class="header">
            <h1>📐 गणित विषय डॅशबोर्ड 📐</h1>
            <p style="margin-top: 8px; color: #aaa;">अभ्यास करण्यासाठी खालील घटकावर क्लिक करा</p>
        </div>

        <!-- गणित घटकांची यादी (१ नंबरला १ ते १००० अंक) -->
        <div class="dash-grid">
            
            <!-- १. पहिले कार्ड: १ ते १००० अंक -->
            <a href="numbers.html" class="menu-card">
                <div class="card-icon">🔢</div>
                <div class="card-title">१ ते १००० अंक</div>
                <div class="card-desc">मराठी अंक ओळख, गट आणि ध्वनीसह अभ्यासा</div>
            </a>

            <!-- २. पाढे (भविष्यात जोडण्यासाठी) -->
            <a href="#" class="menu-card" style="opacity: 0.6; cursor: not-allowed;">
                <div class="card-icon">✖️</div>
                <div class="card-title">पाढे (Tables)</div>
                <div class="card-desc">१ ते ३० पाढे (लवकरच येत आहे)</div>
            </a>

            <!-- ३. बेरीज व वजाबाकी -->
            <a href="#" class="menu-card" style="opacity: 0.6; cursor: not-allowed;">
                <div class="card-icon">➕</div>
                <div class="card-title">बेरीज व वजाबाकी</div>
                <div class="card-desc">चित्रांच्या सहाय्याने सोपी बेरीज-वजाबाकी</div>
            </a>

        </div>
    </div>

    <script>
        // Background Animation
        try {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-bg'), antialias: true, alpha: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            let starGeo = new THREE.BufferGeometry();
            let starCount = 1500;
            let positions = new Float32Array(starCount * 3);

            for(let i = 0; i < starCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 1000;
                positions[i*3+1] = (Math.random() - 0.5) * 1000;
                positions[i*3+2] = Math.random() * 1000;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            let starMaterial = new THREE.PointsMaterial({ color: 0x38ef7d, size: 1.5, transparent: true, opacity: 0.6 });
            let stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);
            camera.position.z = 1;

            function animateStars() {
                let posArr = starGeo.attributes.position.array;
                for(let i = 0; i < starCount; i++) {
                    posArr[i*3+2] -= 2;
                    if(posArr[i*3+2] < 0) posArr[i*3+2] = 1000;
                }
                starGeo.attributes.position.needsUpdate = true;
                renderer.render(scene, camera);
                requestAnimationFrame(animateStars);
            }
            animateStars();
        } catch(e) {}
    </script>
</body>
</html>
