<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Recognition - 1 to 1000</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        body { 
            background: #020205;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        #webgl-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        .main-container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; }

        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-tools { display: flex; gap: 10px; }

        .back-btn, .tool-btn { 
            background: rgba(255, 255, 255, 0.08); 
            border: 1px solid rgba(56, 239, 125, 0.5); 
            color: #38ef7d;
            padding: 10px 22px; 
            border-radius: 30px; 
            font-weight: 700; 
            backdrop-filter: blur(20px);
            box-shadow: 0 0 15px rgba(56, 239, 125, 0.2);
            font-size: 14px; 
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover, .tool-btn:hover { 
            background: rgba(56, 239, 125, 0.25); 
            box-shadow: 0 0 25px rgba(56, 239, 125, 0.6); 
        }

        .header { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px 20px; 
            border-radius: 30px; 
            backdrop-filter: blur(25px);
            margin-bottom: 25px; 
        }

        h1 { 
            background: linear-gradient(135deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px; 
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 239, 125, 0.3);
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #38ef7d;
            text-align: left;
            padding-left: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 100 चे मुख्य गट (Tabs) */
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .dash-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 239, 125, 0.3);
            padding: 14px 10px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .dash-card:hover, .dash-card.active {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #000000;
            border-color: #38ef7d;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.5);
        }

        /* शोध आणि कंट्रोल बार */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid rgba(56, 239, 125, 0.4);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 220px;
        }

        .search-input::placeholder { color: #888; }

        /* अंकांचे Vertical Grid (उभी मांडणी) */
        .number-grid {
            display: grid;
            grid-template-rows: repeat(10, auto);
            grid-auto-flow: column;
            gap: 12px;
            justify-content: start;
            overflow-x: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .num-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 239, 125, 0.2);
            padding: 16px 8px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
            user-select: none;
            min-width: 75px;
            text-align: center;
        }

        .num-card:hover, .num-card.speaking {
            transform: scale(1.15);
            background: rgba(56, 239, 125, 0.4);
            border-color: #38ef7d;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(56, 239, 125, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="webgl-bg"></canvas>

    <div class="main-container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">⬅️ Back to Dashboard</a>
            <div class="action-tools">
                <button class="tool-btn" id="playAllBtn" onclick="togglePlayAll()">▶️ Read All</button>
                <button class="tool-btn" onclick="toggleFullScreen()">📺 Fullscreen</button>
            </div>
        </div>

        <div class="header">
            <h1>🔢 Number Recognition (1 to 1000) 🔢</h1>
            <p style="margin-top: 8px; color: #aaa;">Click on any group to explore and listen to numbers</p>
        </div>

        <div class="section-title">📌 Select Group:</div>
        <div class="dash-grid" id="dashGrid"></div>

        <div class="controls-bar">
            <div class="section-title" id="currentGroupTitle" style="margin: 0;">🔢 Numbers: 1 to 100</div>
            <input type="number" id="searchInput" class="search-input" placeholder="🔍 Search number..." min="1" max="1000" oninput="searchNumber()">
        </div>

        <div class="number-grid" id="numberGrid"></div>
    </div>

    <script>
        // 1. Three.js Background Animation
        try {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-bg'), antialias: true, alpha: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            let starGeo = new THREE.BufferGeometry();
            let starCount = 1500;
            let positions = new Float32Array(starCount * 3);

            for(let i = 0; i < starCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 1000;
                positions[i*3+1] = (Math.random() - 0.5) * 1000;
                positions[i*3+2] = Math.random() * 1000;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            let starMaterial = new THREE.PointsMaterial({ color: 0x38ef7d, size: 1.5, transparent: true, opacity: 0.6 });
            let stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);
            camera.position.z = 1;

            function animateStars() {
                let posArr = starGeo.attributes.position.array;
                for(let i = 0; i < starCount; i++) {
                    posArr[i*3+2] -= 2;
                    if(posArr[i*3+2] < 0) posArr[i*3+2] = 1000;
                }
                starGeo.attributes.position.needsUpdate = true;
                renderer.render(scene, camera);
                requestAnimationFrame(animateStars);
            }
            animateStars();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        } catch(e) {}

        const dashGrid = document.getElementById('dashGrid');
        const numberGrid = document.getElementById('numberGrid');
        const currentGroupTitle = document.getElementById('currentGroupTitle');
        let currentStart = 1;
        let currentEnd = 100;
        let isPlayingAll = false;
        let playInterval = null;

        // Render 10 Groups (1-100, 101-200...)
        for (let i = 0; i < 10; i++) {
            let start = i * 100 + 1;
            let end = (i + 1) * 100;
            
            let card = document.createElement('div');
            card.className = `dash-card ${i === 0 ? 'active' : ''}`;
            card.innerHTML = `${start} to ${end}`;
            
            card.onclick = () => {
                stopPlayAll();
                document.querySelectorAll('.dash-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                currentStart = start;
                currentEnd = end;
                loadNumbers(start, end);
            };
            
            dashGrid.appendChild(card);
        }

        // Load numbers into grid
        function loadNumbers(start, end) {
            currentGroupTitle.innerText = `🔢 Numbers: ${start} to ${end}`;
            numberGrid.innerHTML = '';

            for (let num = start; num <= end; num++) {
                let card = document.createElement('div');
                card.className = 'num-card';
                card.id = `num-${num}`;
                card.innerText = num;
                card.onclick = () => {
                    stopPlayAll();
                    speakNumber(num, card);
                };
                numberGrid.appendChild(card);
            }

            if (typeof gsap !== 'undefined') {
                gsap.from(".num-card", {
                    scale: 0.6,
                    opacity: 0,
                    duration: 0.2,
                    stagger: 0.002,
                    ease: "power1.out"
                });
            }
        }

        // Single Click Voice Function
        function speakNumber(num, cardElement) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                document.querySelectorAll('.num-card').forEach(c => c.classList.remove('speaking'));
                if (cardElement) cardElement.classList.add('speaking');

                let msg = new SpeechSynthesisUtterance(num.toString());
                msg.lang = 'en-IN';
                msg.rate = 0.85;

                msg.onend = () => {
                    if (cardElement) cardElement.classList.remove('speaking');
                };

                window.speechSynthesis.speak(msg);
            }
        }

        // Search number functionality
        function searchNumber() {
            stopPlayAll();
            let query = parseInt(document.getElementById('searchInput').value);
            if (query >= 1 && query <= 1000) {
                let groupIndex = Math.floor((query - 1) / 100);
                let start = groupIndex * 100 + 1;
                let end = (groupIndex + 1) * 100;

                document.querySelectorAll('.dash-card').forEach((c, idx) => {
                    c.classList.toggle('active', idx === groupIndex);
                });

                loadNumbers(start, end);
                let targetCard = document.getElementById(`num-${query}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    speakNumber(query, targetCard);
                }
            }
        }

        // Read all numbers (Strict Synchronized Logic using Polling)
        function togglePlayAll() {
            if (isPlayingAll) {
                stopPlayAll();
            } else {
                isPlayingAll = true;
                document.getElementById('playAllBtn').innerText = '⏹️ Stop Reading';
                startReadingLoop(currentStart);
            }
        }

        function startReadingLoop(startNum) {
            let currentNum = startNum;

            function processNext() {
                if (!isPlayingAll || currentNum > currentEnd) {
                    stopPlayAll();
                    return;
                }

                // जर ब्राऊझर अजूनही मागचा अंक बोलत असेल, तर ५०ms थांबा आणि पुन्हा चेक करा
                if (window.speechSynthesis.speaking) {
                    playInterval = setTimeout(processNext, 50);
                    return;
                }

                // जुने हायलाइट्स काढा
                document.querySelectorAll('.num-card').forEach(c => c.classList.remove('speaking'));

                let card = document.getElementById(`num-${currentNum}`);
                if (card) {
                    card.classList.add('speaking');
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                }

                // नवीन आवाज सुरू करा
                let msg = new SpeechSynthesisUtterance(currentNum.toString());
                msg.lang = 'en-IN';
                msg.rate = 0.85;

                window.speechSynthesis.speak(msg);
                
                currentNum++;

                // पुढील अंकासाठी ५०ms नंतर स्थिती तपासा
                playInterval = setTimeout(processNext, 100);
            }

            window.speechSynthesis.cancel();
            processNext();
        }

        function stopPlayAll() {
            isPlayingAll = false;
            clearTimeout(playInterval);
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            document.querySelectorAll('.num-card').forEach(c => c.classList.remove('speaking'));
            document.getElementById('playAllBtn').innerText = '▶️ Read All';
        }

        // Initialize with 1 to 100
        loadNumbers(1, 100);

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
