<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डिजिटल शाळा - होम</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        
        /* Cosmic Animated Background */
        body { 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Stars Animation Effect */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #00f2fe, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 50px 160px, #4facfe, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 90px 40px, #ff0844, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.6;
            pointer-events: none;
            animation: stars 20s linear infinite;
        }

        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }

        /* Container for Desktop Alignment */
        .main-container { max-width: 800px; margin: 0 auto; position: relative; z-index: 10; }

        /* Top Bar Tools */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .tool-btn { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: #00f2fe;
            padding: 8px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            transition: 0.3s;
        }
        .tool-btn:hover { background: rgba(0, 242, 254, 0.2); box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }

        /* Date Banner */
        .date-banner { 
            background: rgba(255, 255, 255, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            color: #e0e0e0; 
            backdrop-filter: blur(10px);
            font-size: 14px; 
        }

        /* Glassmorphism Header */
        .header { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px 20px; 
            border-radius: 24px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(12px);
            margin-bottom: 25px; 
        }
        h1 { 
            background: linear-gradient(to right, #00f2fe, #4facfe, #ff0844);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 30px; 
            margin-bottom: 15px; 
            font-weight: 800;
        }
        
        /* Neon Search Box */
        .search-box {
            width: 100%; max-width: 450px; padding: 12px 20px; font-size: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 254, 0.5); 
            color: #fff;
            border-radius: 25px; outline: none;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            transition: 0.3s;
        }
        .search-box::placeholder { color: #aaa; }
        .search-box:focus { border-color: #ff0844; box-shadow: 0 0 15px rgba(255, 8, 68, 0.5); }

        /* Grid Layout */
        .subject-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 18px; 
            justify-content: center;
        }

        /* Glowing Glass Cards */
        .subject-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 22px 10px; border-radius: 20px; 
            backdrop-filter: blur(10px);
            text-decoration: none; color: white; font-size: 20px; font-weight: bold;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 12px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .subject-card:hover { 
            transform: translateY(-8px) scale(1.02); 
            border-color: rgba(255, 255, 255, 0.5);
        }
        .subject-card:active { transform: scale(0.95); }

        .icon { 
            font-size: 38px; 
            padding: 10px; 
            border-radius: 50%; 
            width: 65px; height: 65px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* Custom Glowing Card Themes */
        .marathi { border-bottom: 3px solid #ff416c; }
        .marathi .icon { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
        .marathi:hover { box-shadow: 0 0 20px rgba(255, 65, 108, 0.5); }

        .hindi { border-bottom: 3px solid #f7971e; }
        .hindi .icon { background: linear-gradient(45deg, #f7971e, #ffd200); }
        .hindi:hover { box-shadow: 0 0 20px rgba(247, 151, 30, 0.5); }

        .english { border-bottom: 3px solid #00f2fe; }
        .english .icon { background: linear-gradient(45deg, #00f2fe, #4facfe); }
        .english:hover { box-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }

        .maths { border-bottom: 3px solid #38ef7d; }
        .maths .icon { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .maths:hover { box-shadow: 0 0 20px rgba(56, 239, 125, 0.5); }

        .science { border-bottom: 3px solid #b224ef; }
        .science .icon { background: linear-gradient(45deg, #b224ef, #7579ff); }
        .science:hover { box-shadow: 0 0 20px rgba(178, 36, 239, 0.5); }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Top Bar Tools -->
        <div class="top-bar">
            <div class="date-banner" id="currentDate">📅 तारीख शोधत आहे...</div>
            <button class="tool-btn" onclick="toggleFullScreen()">📺 Fullscreen</button>
        </div>

        <!-- Header & Search Box -->
        <div class="header">
            <h1>✨ डिजिटल प्राथमिक शाळा ✨</h1>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 विषय शोधा (उदा. मराठी, गणित)..." onkeyup="filterSubjects()">
        </div>

        <!-- Subjects Grid -->
        <div class="subject-grid" id="subjectGrid">
            <a href="marathi/index.html" class="subject-card marathi" onclick="playClickSound()">
                <span class="icon">🚩</span> <span class="subject-title">मराठी</span>
            </a>
            <a href="hindi/index.html" class="subject-card hindi" onclick="playClickSound()">
                <span class="icon">🇮🇳</span> <span class="subject-title">हिंदी</span>
            </a>
            <a href="english/index.html" class="subject-card english" onclick="playClickSound()">
                <span class="icon">🔤</span> <span class="subject-title">English</span>
            </a>
            <a href="maths/index.html" class="subject-card maths" onclick="playClickSound()">
                <span class="icon">🔢</span> <span class="subject-title">गणित</span>
            </a>
            <a href="science/index.html" class="subject-card science" onclick="playClickSound()">
                <span class="icon">🔬</span> <span class="subject-title">विज्ञान</span>
            </a>
        </div>
    </div>

    <script>
        // Auto Date & Day in Marathi
        function setMarathiDate() {
            const days = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
            const months = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];
            
            const today = new Date();
            const dayName = days[today.getDay()];
            const dateNum = today.getDate();
            const monthName = months[today.getMonth()];
            const yearNum = today.getFullYear();

            document.getElementById("currentDate").innerText = `📅 ${dayName}, ${dateNum} ${monthName} ${yearNum}`;
        }

        // Search Filter
        function filterSubjects() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let cards = document.querySelectorAll(".subject-card");

            cards.forEach(card => {
                let text = card.querySelector(".subject-title").innerText.toLowerCase();
                if (text.includes(input)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }

        // Audio Welcome
        window.onload = function() {
            setMarathiDate();
            let msg = new SpeechSynthesisUtterance("डिजिटल शाळेमध्ये तुमचे स्वागत आहे! तुमचा विषय निवडा.");
            msg.lang = 'mr-IN';
            window.speechSynthesis.speak(msg);
        };

        function playClickSound() {
            let msg = new SpeechSynthesisUtterance("उघडत आहे");
            msg.lang = 'mr-IN';
            window.speechSynthesis.speak(msg);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
