<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डिजिटल शाळा - होम</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        
        /* Animated Background */
        body { 
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh; text-align: center; padding: 15px; color: #333;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Dark Mode */
        body.dark-mode { background: #121212 !important; color: white !important; }
        body.dark-mode .header, body.dark-mode .quote-box { background: #1e1e1e; color: white; }

        /* Top Bar: Reward & Tools */
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 650px; margin: 0 auto 10px auto; }
        .star-box { background: #fff3cd; color: #856404; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tool-btn { background: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Header */
        .header { background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); max-width: 650px; margin: 0 auto 15px auto; }
        h1 { color: #2c3e50; font-size: 24px; }
        
        /* Daily Quote */
        .quote-box { background: #e8f4f8; border-left: 4px solid #3498db; padding: 8px; margin-top: 10px; border-radius: 5px; font-size: 13px; color: #2c3e50; }

        /* Class Selection Tabs */
        .class-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .class-btn { padding: 8px 14px; font-size: 13px; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; background: white; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .class-btn.active { background: #ff4757; color: white; }

        /* Grid */
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; max-width: 650px; margin: 0 auto; }

        /* Subject Cards */
        .subject-card {
            padding: 20px 10px; border-radius: 18px; box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            text-decoration: none; color: white; font-size: 20px; font-weight: bold;
            transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .subject-card:active { transform: scale(0.95); }
        .icon { font-size: 38px; background: rgba(255,255,255,0.2); padding: 8px; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }

        /* Color Schemes */
        .marathi { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
        .hindi { background: linear-gradient(45deg, #f7971e, #ffd200); }
        .english { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .maths { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .science { background: linear-gradient(45deg, #8e2de2, #4a00e0); }
    </style>
</head>
<body>

    <!-- Top Tools & Stars -->
    <div class="top-bar">
        <div class="star-box">⭐ आजचे स्टार: 10/10</div>
        <div>
            <button class="tool-btn" onclick="toggleDarkMode()">🌙/☀️</button>
            <button class="tool-btn" onclick="toggleFullScreen()">📺 Fullscreen</button>
        </div>
    </div>

    <!-- Header & Quote -->
    <div class="header">
        <h1>🏫 डिजिटल प्राथमिक शाळा</h1>
        <div class="quote-box">💭 <b>आजचा विचार:</b> “वाचाल तर वाचाल!”</div>
    </div>

    <!-- Class Selection Tabs -->
    <div class="class-tabs">
        <button class="class-btn active" onclick="selectClass(this)">इयत्ता १ ली</button>
        <button class="class-btn" onclick="selectClass(this)">इयत्ता २ री</button>
        <button class="class-btn" onclick="selectClass(this)">इयत्ता ३ री</button>
        <button class="class-btn" onclick="selectClass(this)">इयत्ता ४ थी</button>
    </div>

    <!-- Subjects Grid -->
    <div class="subject-grid">
        <a href="marathi/index.html" class="subject-card marathi" onclick="playClickSound()">
            <span class="icon">🚩</span> मराठी
        </a>
        <a href="hindi/index.html" class="subject-card hindi" onclick="playClickSound()">
            <span class="icon">🇮🇳</span> हिंदी
        </a>
        <a href="english/index.html" class="subject-card english" onclick="playClickSound()">
            <span class="icon">🔤</span> English
        </a>
        <a href="maths/index.html" class="subject-card maths" onclick="playClickSound()">
            <span class="icon">🔢</span> गणित
        </a>
        <a href="science/index.html" class="subject-card science" onclick="playClickSound()">
            <span class="icon">🔬</span> विज्ञान
        </a>
    </div>

    <script>
        // Audio & Welcome Sound
        window.onload = function() {
            let msg = new SpeechSynthesisUtterance("डिजिटल शाळेमध्ये तुमचे स्वागत आहे! तुमचा विषय निवडा.");
            msg.lang = 'mr-IN';
            window.speechSynthesis.speak(msg);
        };

        function playClickSound() {
            let msg = new SpeechSynthesisUtterance("उघडत आहे");
            msg.lang = 'mr-IN';
            window.speechSynthesis.speak(msg);
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        // Fullscreen Toggle
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Class Selection Logic
        function selectClass(element) {
            document.querySelectorAll('.class-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
