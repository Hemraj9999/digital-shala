<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डिजिटल शाळा - हायपर ३D वर्ल्ड</title>

    <!-- Three.js & GSAP Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        body { 
            background: #020205;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        #webgl-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .main-container { max-width: 850px; margin: 0 auto; position: relative; z-index: 10; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 12px; }

        .tool-btn, .date-banner { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(0, 242, 254, 0.4); 
            color: #00f2fe;
            padding: 10px 22px; 
            border-radius: 30px; 
            font-weight: 700; 
            backdrop-filter: blur(25px);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            font-size: 14px; 
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .tool-btn { cursor: pointer; }
        .tool-btn:hover { background: rgba(0, 242, 254, 0.25); box-shadow: 0 0 30px rgba(0, 242, 254, 0.8); }

        .header { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 20px; 
            border-radius: 35px; 
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(30px);
            margin-bottom: 35px; 
            position: relative;
        }

        h1 { 
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #ff0844 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 36px; 
            margin-bottom: 18px; 
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }

        .search-box {
            width: 100%; max-width: 480px; padding: 15px 25px; font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 242, 254, 0.5); 
            color: #fff;
            border-radius: 30px; outline: none;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .search-box::placeholder { color: #888; }
        .search-box:focus { border-color: #ff0844; box-shadow: 0 0 30px rgba(255, 8, 68, 0.6); }

        .subject-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 22px; 
            justify-content: center;
            perspective: 1200px;
        }

        /* Container wrapper handles floating animation */
        .card-wrapper {
            perspective: 1000px;
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 28px 12px; border-radius: 28px; 
            backdrop-filter: blur(25px);
            text-decoration: none; color: white; font-size: 20px; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .icon { 
            font-size: 45px; padding: 12px; border-radius: 50%; 
            width: 80px; height: 80px; 
            display: flex; align-items: center; justify-content: center; 
            transform: translateZ(35px);
        }

        .subject-title { transform: translateZ(25px); }

        /* Glowing Accents */
        .marathi { border-bottom: 3px solid #ff416c; }
        .marathi .icon { background: linear-gradient(135deg, #ff416c, #ff4b2b); box-shadow: 0 10px 30px rgba(255, 65, 108, 0.6); }

        .hindi { border-bottom: 3px solid #f7971e; }
        .hindi .icon { background: linear-gradient(135deg, #f7971e, #ffd200); box-shadow: 0 10px 30px rgba(247, 151, 30, 0.6); }

        .english { border-bottom: 3px solid #00f2fe; }
        .english .icon { background: linear-gradient(135deg, #00f2fe, #4facfe); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.6); }

        .maths { border-bottom: 3px solid #38ef7d; }
        .maths .icon { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 10px 30px rgba(56, 239, 125, 0.6); }

        .science { border-bottom: 3px solid #b224ef; }
        .science .icon { background: linear-gradient(135deg, #b224ef, #7579ff); box-shadow: 0 10px 30px rgba(178, 36, 239, 0.6); }
    </style>
</head>
<body>

    <canvas id="webgl-bg"></canvas>

    <div class="main-container">
        <div class="top-bar">
            <div class="date-banner" id="currentDate">📅 तारीख लोड होत आहे...</div>
            <button class="tool-btn" onclick="toggleFullScreen()">📺 Fullscreen</button>
        </div>

        <div class="header">
            <h1>✨ डिजिटल प्राथमिक शाळा ✨</h1>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 विषय शोधा (उदा. मराठी, गणित)..." onkeyup="filterSubjects()">
        </div>

        <div class="subject-grid" id="subjectGrid">
            <div class="card-wrapper">
                <a href="marathi/index.html" class="subject-card marathi" onclick="playClickSound()">
                    <span class="icon">🚩</span> <span class="subject-title">मराठी</span>
                </a>
            </div>
            <div class="card-wrapper">
                <a href="hindi/index.html" class="subject-card hindi" onclick="playClickSound()">
                    <span class="icon">🇮🇳</span> <span class="subject-title">हिंदी</span>
                </a>
            </div>
            <div class="card-wrapper">
                <a href="english/index.html" class="subject-card english" onclick="playClickSound()">
                    <span class="icon">🔤</span> <span class="subject-title">English</span>
                </a>
            </div>
            <div class="card-wrapper">
                <a href="maths/index.html" class="subject-card maths" onclick="playClickSound()">
                    <span class="icon">🔢</span> <span class="subject-title">गणित</span>
                </a>
            </div>
            <div class="card-wrapper">
                <a href="science/index.html" class="subject-card science" onclick="playClickSound()">
                    <span class="icon">🔬</span> <span class="subject-title">विज्ञान</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 1. Hyper-Speed 3D Starfield Engine
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-bg'), antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        let starGeo = new THREE.BufferGeometry();
        let starCount = 3000;
        let positions = new Float32Array(starCount * 3);

        for(let i = 0; i < starCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 1000;
            positions[i*3+1] = (Math.random() - 0.5) * 1000;
            positions[i*3+2] = Math.random() * 1000;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        let starMaterial = new THREE.PointsMaterial({
            color: 0x00f2fe,
            size: 1.5,
            transparent: true,
            opacity: 0.8
        });

        let stars = new THREE.Points(starGeo, starMaterial);
        scene.add(stars);

        camera.position.z = 1;

        function animateStars() {
            let posArr = starGeo.attributes.position.array;
            for(let i = 0; i < starCount; i++) {
                posArr[i*3+2] -= 3;
                if(posArr[i*3+2] < 0) {
                    posArr[i*3+2] = 1000;
                }
            }
            starGeo.attributes.position.needsUpdate = true;
            stars.rotation.z += 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animateStars);
        }
        animateStars();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // 2. GSAP Floating Cards
        gsap.to(".card-wrapper", {
            y: "-=12",
            duration: 2.5,
            repeat: -1,
            yoyo: true,
            ease: "power1.inOut",
            stagger: 0.15
        });

        // 3. Smooth GSAP 3D Parallax Tilt on Cards
        const cards = document.querySelectorAll('.subject-card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                gsap.to(card, {
                    rotationY: x / 5,
                    rotationX: -y / 5,
                    z: 15,
                    duration: 0.2,
                    ease: "power1.out"
                });
            });

            card.addEventListener('mouseleave', () => {
                gsap.to(card, {
                    rotationY: 0,
                    rotationX: 0,
                    z: 0,
                    duration: 0.5,
                    ease: "power2.out"
                });
            });
        });

        // 4. Auto Date & Utilities
        function setMarathiDate() {
            const days = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
            const months = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];
            const today = new Date();
            document.getElementById("currentDate").innerText = `📅 ${days[today.getDay()]}, ${today.getDate()} ${months[today.getMonth()]} ${today.getFullYear()}`;
        }

        function filterSubjects() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            const wrappers = document.querySelectorAll('.card-wrapper');
            wrappers.forEach(wrapper => {
                let text = wrapper.querySelector(".subject-title").innerText.toLowerCase();
                wrapper.style.display = text.includes(input) ? "block" : "none";
            });
        }

        // Voice handling (handles browser user interaction constraints)
        let hasSpokenWelcome = false;
        function speakWelcome() {
            if (hasSpokenWelcome) return;
            hasSpokenWelcome = true;
            let msg = new SpeechSynthesisUtterance("डिजिटल शाळेमध्ये तुमचे स्वागत आहे! तुमचा विषय निवडा.");
            msg.lang = 'mr-IN';
            window.speechSynthesis.speak(msg);
        }

        window.onload = function() {
            setMarathiDate();
            window.addEventListener('click', speakWelcome, { once: true });
            window.addEventListener('touchstart', speakWelcome, { once: true });
        };

        function playClickSound() {
            let msg = new SpeechSynthesisUtterance("उघडत आहे");
            msg.lang = 'mr-IN';
            window.speechSynthesis.speak(msg);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
