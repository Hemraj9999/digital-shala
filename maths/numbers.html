<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अंक ओळख - १ ते १००० (डिजिटल शाळा)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        body { 
            background: #020205;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas बॅकग्राउंड सर्वात मागे ठेवण्यासाठी z-index: -1 केले आहे */
        #webgl-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; 
            pointer-events: none;
        }

        .main-container { 
            max-width: 1100px; 
            margin: 0 auto; 
            position: relative; 
            z-index: 10; 
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .back-btn, .tool-btn { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(56, 239, 125, 0.5); 
            color: #38ef7d;
            padding: 10px 22px; 
            border-radius: 30px; 
            font-weight: 700; 
            backdrop-filter: blur(20px);
            box-shadow: 0 0 15px rgba(56, 239, 125, 0.2);
            font-size: 14px; 
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover, .tool-btn:hover { 
            background: rgba(56, 239, 125, 0.25); 
            box-shadow: 0 0 25px rgba(56, 239, 125, 0.6); 
        }

        .header { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px 20px; 
            border-radius: 30px; 
            backdrop-filter: blur(25px);
            margin-bottom: 25px; 
        }

        h1 { 
            background: linear-gradient(135deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px; 
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 239, 125, 0.3);
        }

        /* १०० चे गट (Tabs) */
        .group-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #000000;
            border-color: #38ef7d;
            box-shadow: 0 0 20px rgba(56, 239, 125, 0.6);
        }

        /* अंकांची Grid */
        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            justify-content: center;
            min-height: 300px;
        }

        .num-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(56, 239, 125, 0.3);
            padding: 18px 10px;
            border-radius: 18px;
            backdrop-filter: blur(20px);
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
            user-select: none;
        }

        .num-card:hover {
            transform: scale(1.1);
            background: rgba(56, 239, 125, 0.3);
            border-color: #38ef7d;
            box-shadow: 0 0 20px rgba(56, 239, 125, 0.6);
        }
    </style>
</head>
<body>

    <canvas id="webgl-bg"></canvas>

    <div class="main-container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">⬅️ डॅशबोर्डवर जा</a>
            <button class="tool-btn" onclick="toggleFullScreen()">📺 Fullscreen</button>
        </div>

        <div class="header">
            <h1>🔢 अंक ओळख (१ ते १०००) 🔢</h1>
            <p style="margin-top: 8px; color: #ddd;">खालील १०० च्या गटावर क्लिक करा आणि अंक मराठीत पहा व ऐका</p>
        </div>

        <!-- १०० चे १० मराठी टॅब्स -->
        <div class="group-tabs" id="tabsContainer"></div>

        <!-- मराठी अंकांचे ग्रिड -->
        <div class="number-grid" id="numberGrid"></div>
    </div>

    <script>
        // 1. Background Animation (Three.js)
        try {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-bg'), antialias: true, alpha: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            let starGeo = new THREE.BufferGeometry();
            let starCount = 1500;
            let positions = new Float32Array(starCount * 3);

            for(let i = 0; i < starCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 1000;
                positions[i*3+1] = (Math.random() - 0.5) * 1000;
                positions[i*3+2] = Math.random() * 1000;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            let starMaterial = new THREE.PointsMaterial({ color: 0x38ef7d, size: 1.5, transparent: true, opacity: 0.6 });
            let stars = new THREE.Points(starGeo, starMaterial);
            scene.add(stars);
            camera.position.z = 1;

            function animateStars() {
                let posArr = starGeo.attributes.position.array;
                for(let i = 0; i < starCount; i++) {
                    posArr[i*3+2] -= 2;
                    if(posArr[i*3+2] < 0) posArr[i*3+2] = 1000;
                }
                starGeo.attributes.position.needsUpdate = true;
                renderer.render(scene, camera);
                requestAnimationFrame(animateStars);
            }
            animateStars();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        } catch(e) {
            console.log("WebGL render error handled:", e);
        }

        // 2. English Numbers to Marathi Numbers
        function toMarathiDigits(num) {
            const marathiDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
            return num.toString().replace(/\d/g, x => marathiDigits[x]);
        }

        const tabsContainer = document.getElementById('tabsContainer');
        const numberGrid = document.getElementById('numberGrid');

        // १०० च्या १० गटांचे टॅब्स
        for (let i = 0; i < 10; i++) {
            let start = i * 100 + 1;
            let end = (i + 1) * 100;
            
            let btn = document.createElement('button');
            btn.className = `tab-btn ${i === 0 ? 'active' : ''}`;
            btn.innerText = `${toMarathiDigits(start)} ते ${toMarathiDigits(end)}`;
            btn.onclick = () => loadNumbers(start, end, btn);
            tabsContainer.appendChild(btn);
        }

        // अंक लोड करण्याची मुख्य फंक्शन
        function loadNumbers(start, end, activeBtn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(activeBtn) activeBtn.classList.add('active');

            numberGrid.innerHTML = '';

            for (let num = start; num <= end; num++) {
                let card = document.createElement('div');
                card.className = 'num-card';
                card.innerText = toMarathiDigits(num);
                card.onclick = () => speakNumber(num);
                numberGrid.appendChild(card);
            }

            if (typeof gsap !== 'undefined') {
                gsap.from(".num-card", {
                    scale: 0.5,
                    opacity: 0,
                    duration: 0.2,
                    stagger: 0.003,
                    ease: "power1.out"
                });
            }
        }

        // आवाज फंक्शन
        function speakNumber(num) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(num.toString());
                msg.lang = 'mr-IN';
                window.speechSynthesis.speak(msg);
            }
        }

        // सुरुवातीला १ ते १०० चे अंक दाखवा
        loadNumbers(1, 100, tabsContainer.children[0]);

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
