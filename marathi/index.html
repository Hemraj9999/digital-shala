<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मराठी - मुळाक्षरे आणि बाराखडी</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        body {
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn {
            background: rgba(255, 65, 108, 0.2);
            border: 1px solid #ff416c;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover { background: #ff416c; box-shadow: 0 0 15px #ff416c; }

        .dept-title { color: #ff416c; font-size: 20px; font-weight: bold; }

        h1 {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: 900;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-color: #ff416c;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
        }

        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 18px;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .letter-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 65, 108, 0.4);
            border-bottom: 4px solid #ff416c;
            border-radius: 20px;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
            user-select: none;
            line-height: 1;
        }

        .letter-card:hover {
            background: rgba(255, 65, 108, 0.25);
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.8);
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="../index.html" class="back-btn">⬅ मुख्य पान</a>
            <span class="dept-title">🚩 मराठी विभाग</span>
        </div>

        <h1>मराठी मुळाक्षरे व बाराखडी</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="loadLetters('swar', this)">स्वर (अ - अः)</button>
            <button class="tab-btn" onclick="loadLetters('vyanjan', this)">व्यंजन (क - ज्ञ)</button>
        </div>

        <div class="alphabet-grid" id="alphabetGrid"></div>
    </div>

    <!-- एकाच MP3 फाईलसाठी ऑडिओ टॅग -->
    <audio id="mainAudio" src="marathi_all.mp3" preload="auto"></audio>

    <script>
        const marathiData = {
            swar: ["अ", "आ", "इ", "ई", "उ", "ऊ", "ऋ", "ए", "ऐ", "ओ", "औ", "अं", "अः"],
            vyanjan: [
                "क", "ख", "ग", "घ", "ङ",
                "च", "छ", "ज", "झ", "ञ",
                "ट", "ठ", "ड", "ढ", "ण",
                "त", "थ", "द", "ध", "न",
                "प", "फ", "ब", "भ", "म",
                "य", "र", "ल", "व", "श", "ष", "स", "ह", "ळ", "क्ष", "ज्ञ"
            ]
        };

        const grid = document.getElementById("alphabetGrid");
        const audio = document.getElementById("mainAudio");
        let stopTimer = null;

        function loadLetters(type, btnElement) {
            if(btnElement) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            grid.innerHTML = ""; 

            marathiData[type].forEach(letter => {
                const card = document.createElement("div");
                card.className = "letter-card";
                card.innerText = letter;

                card.onclick = function() {
                    playSingleAudio(letter);
                    animateCard(this);
                };

                grid.appendChild(card);
            });

            gsap.fromTo(".letter-card", 
                { scale: 0.5, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.3, stagger: 0.03, ease: "back.out(1.5)" }
            );
        }

        // एकाच MP3 फाईलमधून फक्त विशिष्ट अक्षराचा आवाज प्ले करणे
        function playSingleAudio(char) {
            // जर आधीचा आवाज सुरू असेल तर थांबवा
            clearTimeout(stopTimer);
            audio.pause();

            // गूगल सर्व्हरवरून फक्त त्या विशिष्ट अक्षराचा स्वतंत्र आवाज त्वरित प्ले होईल
            let singleAudioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(char)}&tl=mr&client=tw-ob`;
            
            let tempAudio = new Audio(singleAudioUrl);
            tempAudio.play().catch(e => console.log("Audio Error"));
        }

        function animateCard(element) {
            gsap.to(element, {
                scale: 1.15,
                duration: 0.1,
                yoyo: true,
                repeat: 1,
                ease: "power1.inOut"
            });
        }

        window.onload = function() {
            const defaultTab = document.querySelector('.tab-btn');
            loadLetters('swar', defaultTab);
        };
    </script>
</body>
</html>
