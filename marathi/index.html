<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मराठी - मुळाक्षरे आणि बाराखडी</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }

        body {
            background: #020205;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* Top Bar & Back Button */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: rgba(255, 65, 108, 0.2);
            border: 1px solid #ff416c;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover { background: #ff416c; box-shadow: 0 0 15px #ff416c; }

        h1 {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 32px;
            margin-bottom: 20px;
        }

        /* Mode Selector Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-color: #ff416c;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
        }

        /* Letter Grid Layout */
        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 15px;
            perspective: 1000px;
        }

        /* Separate Individual Letter Card */
        .letter-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 65, 108, 0.3);
            border-bottom: 3px solid #ff416c;
            border-radius: 18px;
            padding: 15px 5px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .letter-card:hover {
            background: rgba(255, 65, 108, 0.2);
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="../index.html" class="back-btn">⬅ मुख्य पान</a>
            <h2>🚩 मराठी विभाग</h2>
        </div>

        <h1>मराठी मुळाक्षरे व बाराखडी</h1>

        <!-- Modes Selection Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="loadLetters('swar')">स्वर (अ - अः)</button>
            <button class="tab-btn" onclick="loadLetters('vyanjan')">व्यंजन (क - ज्ञ)</button>
        </div>

        <!-- Grid for Letters -->
        <div class="alphabet-grid" id="alphabetGrid"></div>
    </div>

    <script>
        // 1. स्वर आणि व्यंजन डेटा
        const marathiData = {
            swar: ["अ", "आ", "इ", "ई", "उ", "ऊ", "ऋ", "ए", "ऐ", "ओ", "औ", "अं", "अः"],
            vyanjan: [
                "क", "ख", "ग", "घ", "ङ",
                "च", "छ", "ज", "झ", "ञ",
                "ट", "ठ", "ड", "ढ", "ण",
                "त", "थ", "द", "ध", "न",
                "प", "फ", "ब", "भ", "म",
                "य", "र", "ल", "व", "श", "ष", "स", "ह", "ळ", "क्ष", "ज्ञ"
            ]
        };

        const grid = document.getElementById("alphabetGrid");

        // 2. अक्षरे लोड करणारे फंक्शन (प्रत्येक अक्षर पूर्णपणे सेपरेट राहील)
        function loadLetters(type) {
            // Active Tab UI update
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            grid.innerHTML = ""; // ग्रिड रिकामी करणे

            marathiData[type].forEach(letter => {
                // प्रत्येक अक्षरासाठी सेपरेट कार्ड
                const card = document.createElement("div");
                card.className = "letter-card";
                card.setAttribute("data-letter", letter); // स्वतंत्र ओळख (ID सारखे)
                card.innerText = letter;

                // जेव्हा एखाद्या विशिष्ट अक्षरावर क्लिक होईल
                card.onclick = function() {
                    speakLetter(letter);
                    animateCard(this);
                };

                grid.appendChild(card);
            });

            // GSAP Entrance Animation
            gsap.from(".letter-card", {
                scale: 0,
                opacity: 0,
                duration: 0.4,
                stagger: 0.03,
                ease: "back.out(1.7)"
            });
        }

        // 3. स्वतंत्र अक्षर उच्चार (TTS)
        function speakLetter(char) {
            let msg = new SpeechSynthesisUtterance(char);
            msg.lang = 'mr-IN';
            msg.rate = 0.8; // स्पष्ट ऐकू येण्यासाठी आवाज थोडा हळू
            window.speechSynthesis.cancel(); // जुना आवाज थांबवणे
            window.speechSynthesis.speak(msg);
        }

        // 4. स्वतंत्र कार्ड ॲनिमेशन
        function animateCard(element) {
            gsap.to(element, {
                scale: 1.2,
                duration: 0.1,
                yoyo: true,
                repeat: 1,
                ease: "power1.inOut"
            });
        }

        // बाय डिफॉल्ट स्वर लोड होतील
        window.onload = function() {
            loadLetters('swar');
        };
    </script>
</body>
</html>
