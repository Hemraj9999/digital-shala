<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मराठी शिक्षण</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #020205; color: #ffffff; min-height: 100vh; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255, 65, 108, 0.2); border: 1px solid #ff416c; color: #fff; padding: 10px 22px; border-radius: 20px; text-decoration: none; font-weight: bold; }
        
        h1 { background: linear-gradient(135deg, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 32px; margin-bottom: 30px; }

        .menu-list { display: flex; flex-direction: column; gap: 15px; }
        
        .menu-card {
            background: #151522;
            border: 2px solid #ff416c;
            color: #fff;
            padding: 18px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            display: block;
        }
        .menu-card:hover { background: #ff416c; box-shadow: 0 0 20px rgba(255, 65, 108, 0.6); }
        .disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="../index.html" class="back-btn">⬅ मुख्य पान</a>
            <span style="color:#ff416c; font-weight:bold;">🚩 मराठी विभाग</span>
        </div>

        <h1>मराठी शिक्षण</h1>

        <div class="menu-list">
            <a href="eka.html" class="menu-card">१. अक्षरे ऐका</a>
            <a href="girva.html" class="menu-card">२. अक्षरे गिरवा</a>
            <a href="#" class="menu-card disabled">३. लवकरच येत आहे</a>
            <a href="#" class="menu-card disabled">४. लवकरच येत आहे</a>
        </div>
    </div>
</body>
</html>
